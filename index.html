<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Binance Box Scanner</title>
  <style>
    :root {
      --bg: #0b0e14;
      --panel: #151a24;
      --border: #2a3141;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --green: #10b981;
      --red: #ef4444;
      --yellow: #f59e0b;
      --blue: #3b82f6;
      --purple: #8b5cf6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 15px;
      font-size: 14px;
    }
    h1 { font-size: 20px; margin-bottom: 10px; color: #fff; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    h1 span { font-size: 11px; background: var(--purple); color: #fff; padding: 3px 8px; border-radius: 12px; }
    
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }
    button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    button:hover { background: var(--border); }
    button.primary { background: var(--blue); border-color: var(--blue); color: white; }
    button.primary:hover { background: #2563eb; }
    button.danger { background: var(--red); border-color: var(--red); color: white; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .status {
      font-size: 13px;
      color: var(--muted);
      margin-left: auto;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      margin: 25px 0 10px 0;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .section-title.pulse { color: var(--purple); }

    .table-wrapper {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th, td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      font-size: 12px;
    }
    th {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      background: #11151d;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover { background: #1a202c; }
    
    .symbol { font-weight: 700; color: #fff; font-size: 13px; }
    .green { color: var(--green); }
    .red { color: var(--red); }
    .yellow { color: var(--yellow); }
    .muted { color: var(--muted); }
    
    .badge {
      display: inline-block;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-green { background: rgba(16, 185, 129, 0.15); color: var(--green); }
    .badge-purple { background: rgba(139, 92, 246, 0.15); color: var(--purple); }

    #log {
      background: #0f131a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      height: 150px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 11px;
      color: var(--muted);
      margin-top: 20px;
    }
    #log div { margin-bottom: 4px; }
    #log .err { color: var(--red); }
    #log .ok { color: var(--green); }
    #log .warn { color: var(--yellow); }
    
    .empty-state {
      padding: 30px;
      text-align: center;
      color: var(--muted);
      font-style: italic;
    }
  </style>
</head>
<body>

  <h1>📦 Binance Box Structure Scanner <span>Consolidation Detector</span></h1>
  
  <div class="controls">
    <button id="scanBtn" class="primary">▶ Scan for Boxes</button>
    <button id="autoBtn">Auto: OFF</button>
    <span class="status" id="status">Ready to scan. (Top 50 coins - ~20s)</span>
  </div>

  <div class="section-title pulse">📦 COINS FORMING A BOX (Price & Volume Contraction)</div>
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Symbol</th>
          <th>Price</th>
          <th>24h%</th>
          <th>Box Range %</th>
          <th>Vol Change %</th>
          <th>Box Length</th>
          <th>Breakout Level</th>
          <th>Drop Level</th>
        </tr>
      </thead>
      <tbody id="boxSignals">
        <tr><td colspan="8" class="empty-state">Scan to find coins forming a box...</td></tr>
      </tbody>
    </table>
  </div>

  <div id="log">Ready.</div>

  <script>
    // --- Configuration ---
    const ENDPOINTS = [
      'https://fapi.binance.com',
      'https://corsproxy.io/?https://fapi.binance.com',
      'https://api.allorigins.win/raw?url=https://fapi.binance.com'
    ];
    const TOP_N = 50; 
    const BOX_PERIOD = 12; // Check last 12 candles (1h timeframe = 12 hours)
    const MIN_BOX_LENGTH = 8; // At least 8 candles must be inside the box
    const MAX_BOX_RANGE_PCT = 3.0; // Max range % for the box (tight range)
    const MIN_ATR_MULTIPLIER = 0.5; // Box height must be > ATR * this
    const VOLUME_DECLINE_THRESHOLD = -10; // Volume must drop by at least 10%
    let autoInterval = null;
    let workingEndpoint = null;

    // --- DOM Elements ---
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');
    const boxSignalsBody = document.getElementById('boxSignals');
    const scanBtn = document.getElementById('scanBtn');
    const autoBtn = document.getElementById('autoBtn');

    // --- Logging ---
    function log(msg, type = '') {
      const time = new Date().toLocaleTimeString();
      const div = document.createElement('div');
      div.className = type;
      div.textContent = `[${time}] ${msg}`;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    // --- API Fetching with Fallback ---
    async function tryFetch(path) {
      const order = workingEndpoint 
        ? [workingEndpoint, ...ENDPOINTS.filter(e => e !== workingEndpoint)]
        : ENDPOINTS;

      let lastErr;
      for (const base of order) {
        const url = path.startsWith('http') ? path : `${base}${path}`;
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (!workingEndpoint) {
            workingEndpoint = base;
            log(`✅ Connected via: ${base}`, 'ok');
          }
          return data;
        } catch (e) {
          lastErr = e;
        }
      }
      throw lastErr || new Error('All endpoints failed');
    }

    // --- Helper: Calculate ATR ---
    function calculateATR(klines, period = 14) {
      if (klines.length < period + 1) return 0;
      let trSum = 0;
      for (let i = klines.length - period; i < klines.length; i++) {
        const high = parseFloat(klines[i][2]);
        const low = parseFloat(klines[i][3]);
        const prevClose = parseFloat(klines[i - 1][4]);
        const tr = Math.max(high - low, Math.abs(high - prevClose), Math.abs(low - prevClose));
        trSum += tr;
      }
      return trSum / period;
    }

    // --- Core: Box Detection Algorithm ---
    function detectBoxStructure(klines) {
      if (klines.length < BOX_PERIOD) return null;

      const periodKlines = klines.slice(-BOX_PERIOD);
      
      const highs = periodKlines.map(k => parseFloat(k[2]));
      const lows = periodKlines.map(k => parseFloat(k[3]));
      const closes = periodKlines.map(k => parseFloat(k[4]));
      const volumes = periodKlines.map(k => parseFloat(k[5]));

      const boxHigh = Math.max(...highs);
      const boxLow = Math.min(...lows);
      const boxRange = boxHigh - boxLow;
      const boxRangePct = (boxRange / boxLow) * 100;

      // 1. Check Box Range Percentage (Must be tight)
      if (boxRangePct > MAX_BOX_RANGE_PCT || boxRangePct <= 0) return null;

      // 2. Check ATR Filter
      const atr = calculateATR(periodKlines);
      if (atr === 0 || boxRange < atr * MIN_ATR_MULTIPLIER) return null;

      // 3. Count inside candles
      let insideCount = 0;
      for (let i = 0; i < periodKlines.length; i++) {
        const o = parseFloat(periodKlines[i][1]); 
        const c = parseFloat(periodKlines[i][4]); 
        const bodyHigh = Math.max(o, c);
        const bodyLow = Math.min(o, c);
        if (bodyHigh <= boxHigh && bodyLow >= boxLow) {
          insideCount++;
        }
      }

      if (insideCount < MIN_BOX_LENGTH) return null;

      // 4. Check Volume Decline
      const recentVolumes = volumes.slice(-6);
      const earlierVolumes = volumes.slice(0, 6);
      const recentAvgVol = recentVolumes.reduce((a, b) => a + b, 0) / recentVolumes.length;
      const earlierAvgVol = earlierVolumes.reduce((a, b) => a + b, 0) / earlierVolumes.length;
      const volumeChangePct = earlierAvgVol > 0 ? ((recentAvgVol - earlierAvgVol) / earlierAvgVol) * 100 : 0;

      if (volumeChangePct > VOLUME_DECLINE_THRESHOLD) return null;

      return {
        boxHigh,
        boxLow,
        boxRangePct,
        volumeChangePct,
        insideCount
      };
    }

    // --- Main Scan Function ---
    async function scan() {
      statusEl.textContent = 'Scanning...';
      scanBtn.disabled = true;
      logEl.innerHTML = ''; 
      log('Starting box structure scan...');
      
      boxSignalsBody.innerHTML = '<tr><td colspan="8" class="empty-state">Scanning for box structures...</td></tr>';

      try {
        const tickers = await tryFetch('/fapi/v1/ticker/24hr');
        if (!Array.isArray(tickers)) throw new Error('Invalid ticker response');

        const usdtPairs = tickers.filter(t => 
          t.symbol.endsWith('USDT') && 
          !t.symbol.includes('UP') && 
          !t.symbol.includes('DOWN') &&
          !['USDCUSDT', 'BUSDUSDT', 'FDUSDUSDT', 'TUSDUSDT'].includes(t.symbol)
        );
        
        usdtPairs.sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume));
        const candidates = usdtPairs.slice(0, TOP_N);
        
        log(`Scanning top ${candidates.length} coins for box structures...`);
        boxSignalsBody.innerHTML = '';
        let boxCount = 0;

        for (const t of candidates) {
          const symbol = t.symbol;
          const price = parseFloat(t.lastPrice);
          const change24h = parseFloat(t.priceChangePercent);

          try {
            // Fetch 1h Klines (need at least BOX_PERIOD + 14 for ATR)
            const klines = await tryFetch(`/fapi/v1/klines?symbol=${symbol}&interval=1h&limit=30`);
            
            if (klines.length < BOX_PERIOD + 1) {
              log(`⚠️ ${symbol}: Not enough data.`);
              continue;
            }

            const box = detectBoxStructure(klines);

            if (box) {
              boxCount++;
              
              // Calculate Breakout and Drop Levels
              const breakoutLevel = box.boxHigh;
              const dropLevel = box.boxLow;

              const row = document.createElement('tr');
              row.innerHTML = `
                <td class="symbol" style="color: var(--purple)">📦 ${symbol}</td>
                <td>$${price < 1 ? price.toFixed(4) : price.toFixed(2)}</td>
                <td class="${change24h >= 0 ? 'green' : 'red'}">${change24h > 0 ? '+' : ''}${change24h.toFixed(2)}%</td>
                <td class="purple" style="font-weight:bold">${box.boxRangePct.toFixed(2)}%</td>
                <td class="red">${box.volumeChangePct.toFixed(1)}%</td>
                <td>${box.insideCount}/12</td>
                <td class="green">$${breakoutLevel.toFixed(4)}</td>
                <td class="red">$${dropLevel.toFixed(4)}</td>
              `;
              boxSignalsBody.appendChild(row);
              log(`📦 BOX FOUND: ${symbol} | Range: ${box.boxRangePct.toFixed(2)}% | Vol Drop: ${box.volumeChangePct.toFixed(1)}%`, 'ok');
            } else {
              log(`   ${symbol}: No box structure.`);
            }

            // Delay to avoid rate limits
            await new Promise(r => setTimeout(r, 150));

          } catch (err) {
            log(`⚠️ Error scanning ${symbol}: ${err.message}`, 'err');
          }
        }

        if (boxCount === 0) {
          boxSignalsBody.innerHTML = '<tr><td colspan="8" class="empty-state">No coins forming a box structure right now.</td></tr>';
        }

        statusEl.textContent = `Done. ${boxCount} box structures found.`;
        log(`Scan complete. Found ${boxCount} box structures.`, 'ok');

      } catch (e) {
        log(`❌ Fatal Error: ${e.message}`, 'err');
        statusEl.textContent = 'Error occurred. Check log.';
        boxSignalsBody.innerHTML = '<tr><td colspan="8" class="empty-state err">Error loading data. Check log.</td></tr>';
      } finally {
        scanBtn.disabled = false;
      }
    }

    // --- Event Listeners ---
    scanBtn.addEventListener('click', scan);

    autoBtn.addEventListener('click', () => {
      if (autoInterval) {
        clearInterval(autoInterval);
        autoInterval = null;
        autoBtn.textContent = 'Auto: OFF';
        autoBtn.classList.remove('danger');
        log('Auto-scan stopped.');
      } else {
        autoInterval = setInterval(scan, 180000); // Every 3 minutes
        autoBtn.textContent = 'Auto: ON';
        autoBtn.classList.add('danger');
        log('Auto-scan started (every 3 mins).');
        scan();
      }
    });
  </script>
</body>
</html>
