<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Binance Box Scanner (All Coins)</title>
  <style>
    :root {
      --bg: #0b0e14; --panel: #151a24; --border: #2a3141;
      --text: #e2e8f0; --muted: #94a3b8;
      --green: #10b981; --red: #ef4444; --yellow: #f59e0b;
      --blue: #3b82f6; --purple: #8b5cf6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; font-size: 14px; }
    h1 { font-size: 18px; margin-bottom: 10px; color: #fff; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    h1 span { font-size: 11px; background: var(--purple); color: #fff; padding: 3px 8px; border-radius: 12px; }
    
    .controls { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
    button { background: var(--panel); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.2s; }
    button:hover { background: var(--border); }
    button.primary { background: var(--blue); border-color: var(--blue); color: white; }
    button.primary:hover { background: #2563eb; }
    button.danger { background: var(--red); border-color: var(--red); color: white; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .status { font-size: 12px; color: var(--muted); margin-left: auto; }
    
    /* Progress Bar */
    .progress-container { width: 100%; background: var(--panel); border-radius: 6px; height: 8px; margin-bottom: 20px; overflow: hidden; border: 1px solid var(--border); }
    .progress-bar { height: 100%; background: var(--blue); width: 0%; transition: width 0.2s; }

    .section-title { font-size: 15px; font-weight: 700; margin: 20px 0 10px 0; padding-bottom: 8px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--purple); }

    .table-wrapper { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 8px 6px; border-bottom: 1px solid var(--border); white-space: nowrap; font-size: 11px; }
    th { color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; background: #11151d; }
    tr:last-child td { border-bottom: none; }
    tr:hover { background: #1a202c; }
    
    .symbol { font-weight: 700; color: #fff; font-size: 12px; }
    .green { color: var(--green); } .red { color: var(--red); } .yellow { color: var(--yellow); } .muted { color: var(--muted); }
    
    #log { background: #0f131a; border: 1px solid var(--border); border-radius: 8px; padding: 10px; height: 120px; overflow-y: auto; font-family: monospace; font-size: 11px; color: var(--muted); margin-top: 20px; }
    #log div { margin-bottom: 4px; }
    #log .err { color: var(--red); } #log .ok { color: var(--green); } #log .warn { color: var(--yellow); }
    .empty-state { padding: 30px; text-align: center; color: var(--muted); font-style: italic; font-size: 13px; }
  </style>
</head>
<body>

  <h1>📦 Binance Box Scanner <span>ALL COINS MODE</span></h1>
  
  <div class="controls">
    <button id="scanBtn" class="primary">▶ Scan All Coins</button>
    <button id="autoBtn">Auto: OFF</button>
    <span class="status" id="status">Ready. (~3-5 minutes)</span>
  </div>
  
  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="section-title">📦 COINS FORMING A BOX (Price & Volume Contraction)</div>
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Symbol</th><th>Price</th><th>24h%</th><th>Box Range %</th>
          <th>Vol Change %</th><th>Box Length</th><th>Breakout</th><th>Drop</th>
        </tr>
      </thead>
      <tbody id="boxSignals">
        <tr><td colspan="8" class="empty-state">Click "Scan All Coins" to start...</td></tr>
      </tbody>
    </table>
  </div>

  <div id="log">Ready.</div>

  <script>
    // --- Configuration ---
    const ENDPOINTS = ['https://fapi.binance.com', 'https://corsproxy.io/?https://fapi.binance.com', 'https://api.allorigins.win/raw?url=https://fapi.binance.com'];
    const TOP_N = 400; // Set to 400 to capture ALL USDT pairs
    const BOX_PERIOD = 12; 
    const MIN_BOX_LENGTH = 8; 
    const MAX_BOX_RANGE_PCT = 3.0; 
    const MIN_ATR_MULTIPLIER = 0.5; 
    const VOLUME_DECLINE_THRESHOLD = -10; 
    let autoInterval = null;
    let workingEndpoint = null;

    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');
    const boxSignalsBody = document.getElementById('boxSignals');
    const scanBtn = document.getElementById('scanBtn');
    const autoBtn = document.getElementById('autoBtn');
    const progressBar = document.getElementById('progressBar');

    function log(msg, type = '') {
      const time = new Date().toLocaleTimeString();
      const div = document.createElement('div');
      div.className = type;
      div.textContent = `[${time}] ${msg}`;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    async function tryFetch(path) {
      const order = workingEndpoint ? [workingEndpoint, ...ENDPOINTS.filter(e => e !== workingEndpoint)] : ENDPOINTS;
      let lastErr;
      for (const base of order) {
        const url = path.startsWith('http') ? path : `${base}${path}`;
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (!workingEndpoint) { workingEndpoint = base; log(`✅ Connected via: ${base}`, 'ok'); }
          return data;
        } catch (e) { lastErr = e; }
      }
      throw lastErr || new Error('All endpoints failed');
    }

    function calculateATR(klines, period = 14) {
      if (klines.length < period + 1) return 0;
      let trSum = 0;
      for (let i = klines.length - period; i < klines.length; i++) {
        const high = parseFloat(klines[i][2]); const low = parseFloat(klines[i][3]);
        const prevClose = parseFloat(klines[i - 1][4]);
        trSum += Math.max(high - low, Math.abs(high - prevClose), Math.abs(low - prevClose));
      }
      return trSum / period;
    }

    function detectBoxStructure(klines) {
      if (klines.length < BOX_PERIOD) return null;
      const periodKlines = klines.slice(-BOX_PERIOD);
      const highs = periodKlines.map(k => parseFloat(k[2]));
      const lows = periodKlines.map(k => parseFloat(k[3]));
      const volumes = periodKlines.map(k => parseFloat(k[5]));
      const boxHigh = Math.max(...highs); const boxLow = Math.min(...lows);
      const boxRange = boxHigh - boxLow; const boxRangePct = (boxRange / boxLow) * 100;

      if (boxRangePct > MAX_BOX_RANGE_PCT || boxRangePct <= 0) return null;
      const atr = calculateATR(periodKlines);
      if (atr === 0 || boxRange < atr * MIN_ATR_MULTIPLIER) return null;

      let insideCount = 0;
      for (let i = 0; i < periodKlines.length; i++) {
        const o = parseFloat(periodKlines[i][1]); const c = parseFloat(periodKlines[i][4]);
        if (Math.max(o, c) <= boxHigh && Math.min(o, c) >= boxLow) insideCount++;
      }
      if (insideCount < MIN_BOX_LENGTH) return null;

      const recentVol = volumes.slice(-6).reduce((a, b) => a + b, 0) / 6;
      const earlierVol = volumes.slice(0, 6).reduce((a, b) => a + b, 0) / 6;
      const volumeChangePct = earlierVol > 0 ? ((recentVol - earlierVol) / earlierVol) * 100 : 0;

      if (volumeChangePct > VOLUME_DECLINE_THRESHOLD) return null;
      return { boxHigh, boxLow, boxRangePct, volumeChangePct, insideCount };
    }

    async function scan() {
      statusEl.textContent = 'Scanning all coins...';
      scanBtn.disabled = true;
      logEl.innerHTML = ''; 
      progressBar.style.width = '0%';
      log('Starting full market box scan (This will take 3-5 minutes)...');
      boxSignalsBody.innerHTML = '<tr><td colspan="8" class="empty-state">Scanning all coins... Please wait.</td></tr>';

      try {
        const tickers = await tryFetch('/fapi/v1/ticker/24hr');
        const usdtPairs = tickers.filter(t => t.symbol.endsWith('USDT') && !t.symbol.includes('UP') && !t.symbol.includes('DOWN') && !['USDCUSDT', 'BUSDUSDT', 'FDUSDUSDT', 'TUSDUSDT'].includes(t.symbol));
        usdtPairs.sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume));
        
        // Take up to TOP_N (400) coins
        const candidates = usdtPairs.slice(0, TOP_N);
        
        log(`Found ${candidates.length} USDT pairs. Starting scan...`);
        boxSignalsBody.innerHTML = '';
        let boxCount = 0;

        for (let i = 0; i < candidates.length; i++) {
          const t = candidates[i];
          const symbol = t.symbol;
          const price = parseFloat(t.lastPrice);
          const change24h = parseFloat(t.priceChangePercent);

          // Update Progress Bar
          const progress = ((i + 1) / candidates.length) * 100;
          progressBar.style.width = `${progress}%`;
          statusEl.textContent = `Scanning ${i + 1}/${candidates.length} (${symbol})...`;

          try {
            const klines = await tryFetch(`/fapi/v1/klines?symbol=${symbol}&interval=1h&limit=30`);
            const box = detectBoxStructure(klines);

            if (box) {
              boxCount++;
              const row = document.createElement('tr');
              row.innerHTML = `
                <td class="symbol" style="color: var(--purple)">📦 ${symbol}</td>
                <td>$${price < 1 ? price.toFixed(4) : price.toFixed(2)}</td>
                <td class="${change24h >= 0 ? 'green' : 'red'}">${change24h > 0 ? '+' : ''}${change24h.toFixed(2)}%</td>
                <td class="purple" style="font-weight:bold">${box.boxRangePct.toFixed(2)}%</td>
                <td class="red">${box.volumeChangePct.toFixed(1)}%</td>
                <td>${box.insideCount}/12</td>
                <td class="green">$${box.boxHigh.toFixed(4)}</td>
                <td class="red">$${box.boxLow.toFixed(4)}</td>
              `;
              boxSignalsBody.appendChild(row);
              log(`📦 BOX FOUND: ${symbol} | Range: ${box.boxRangePct.toFixed(2)}%`, 'ok');
            }
            
            // IMPORTANT: Delay to avoid getting banned by Binance
            // 150ms * 400 coins = 60 seconds minimum
            await new Promise(r => setTimeout(r, 150));

          } catch (err) {
            log(`⚠️ Error ${symbol}: ${err.message}`, 'err');
            await new Promise(r => setTimeout(r, 500)); // Longer delay if rate limited
          }
        }

        if (boxCount === 0) boxSignalsBody.innerHTML = '<tr><td colspan="8" class="empty-state">No box structures found in the entire market right now.</td></tr>';
        
        statusEl.textContent = `Done. Found ${boxCount} boxes.`;
        progressBar.style.width = '100%';
        log(`Scan complete. Found ${boxCount} box structures.`, 'ok');

      } catch (e) {
        log(`❌ Fatal Error: ${e.message}`, 'err');
        statusEl.textContent = 'Error occurred. Check log.';
      } finally {
        scanBtn.disabled = false;
      }
    }

    scanBtn.addEventListener('click', scan);
    autoBtn.addEventListener('click', () => {
      if (autoInterval) {
        clearInterval(autoInterval); autoInterval = null;
        autoBtn.textContent = 'Auto: OFF'; autoBtn.classList.remove('danger');
      } else {
        autoInterval = setInterval(scan, 300000); // 5 minutes between full scans
        autoBtn.textContent = 'Auto: ON'; autoBtn.classList.add('danger');
        scan();
      }
    });
  </script>
</body>
</html>
